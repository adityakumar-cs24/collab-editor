<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>collab-editor</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.25rem; }
      .bar { display: flex; align-items: center; gap: 0.75rem; margin: 0.5rem 0; }
      #status { font-size: 0.9rem; flex: 1; }
      #status.warn { color: #b9770e; }
      #status.error { color: #c0392b; }
      textarea { width: 100%; height: 60vh; box-sizing: border-box; padding: 0.75rem; font: 1rem/1.5 ui-monospace, monospace; }
      .hint { font-size: 0.85rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>collab-editor</h1>
    <div class="bar">
      <div id="status">connecting…</div>
      <button id="toggle" type="button" disabled>Go offline</button>
    </div>
    <textarea id="editor" disabled spellcheck="false" placeholder="Connecting…"></textarea>
    <p class="hint">Open this page in two windows with the same <code>?doc=</code> name to edit together. "Go offline" simulates losing the network: keep typing, then go online again.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
